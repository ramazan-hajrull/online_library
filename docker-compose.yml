services:
  library_back_service:
    container_name: 'library_back'
    build:
      context: .
    ports:
      - "7777:8000"
    networks:
      - myNetwork
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - uploads_data:/app/uploads
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  library_celery_worker_service:
    container_name: 'library_celery_worker'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - uploads_data:/app/uploads
    command: "celery --app=src.tasks.celery_app:celery_instance worker -l INFO "


  library_celery_beat_service:
    container_name: 'library_celery_beat'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    command: "celery --app=src.tasks.celery_app:celery_instance beat -l INFO"

networks:
  myNetwork:
    external: true

volumes:
  uploads_data: